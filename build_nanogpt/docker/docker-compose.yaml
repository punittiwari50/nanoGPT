services:
  nanogpt-phase1-build:
    container_name: nanogpt-phase1-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder-ai
    environment:
      - VIRTUAL_ENV=/opt/venv_nanogpt
      - PATH=/opt/venv_nanogpt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATASETS_DIR=/workspace/datasets
      - PYTHONIOENCODING=utf-8
    volumes:
      - ../..:/workspace/source:rw
      - ../scripts:/workspace/scripts:ro
      - ../dist:/workspace/dist:rw
      - ../logs:/workspace/logs:rw
      - ../datasets:/workspace/datasets:rw
    restart: "no"
    command: ["/workspace/scripts/build.sh"]

  nanogpt-phase1-app:
    container_name: nanogpt-phase1-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      - VIRTUAL_ENV=/opt/venv_nanogpt
      - PATH=/opt/venv_nanogpt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATASETS_DIR=/workspace/datasets
      - APP_PORT=8001
      - PYTHONIOENCODING=utf-8
    ports:
      - "8001:8001"
    volumes:
      - ../..:/workspace/source:ro
      - ../scripts:/workspace/scripts:ro
      - ../dist:/workspace/dist:ro
      - ../logs:/workspace/logs:rw
    restart: unless-stopped
    command: ["/workspace/scripts/deploy.sh"]

  nanogpt-phase1-verify:
    container_name: nanogpt-phase1-verify
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder-ai
    environment:
      - VIRTUAL_ENV=/opt/venv_nanogpt
      - PATH=/opt/venv_nanogpt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATASETS_DIR=/workspace/datasets
      - PYTHONIOENCODING=utf-8
    volumes:
      - ../..:/workspace/source:ro
      - ../scripts:/workspace/scripts:ro
      - ../dist:/workspace/dist:ro
      - ../logs:/workspace/logs:rw
      - ../datasets:/workspace/datasets:ro
    restart: "no"
    command: ["/workspace/scripts/verify.sh"]
