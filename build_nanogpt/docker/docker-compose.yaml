services:
  nanogpt-phase2-build:
    container_name: nanogpt-phase2-build
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder-ai
    environment:
      - VIRTUAL_ENV=/opt/venv_nanogpt
      - PATH=/opt/venv_nanogpt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYTHONIOENCODING=utf-8
    volumes:
      - ../..:/workspace/source:rw
      - ../scripts:/workspace/scripts:ro
      - ../dist:/workspace/dist:rw
      - ../logs:/workspace/logs:rw
      - ../phase1_dist:/workspace/phase1_dist:ro
    restart: "no"
    command: ["/workspace/scripts/build.sh"]

  nanogpt-phase2-app:
    container_name: nanogpt-phase2-app
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      - VIRTUAL_ENV=/opt/venv_nanogpt
      - PATH=/opt/venv_nanogpt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - APP_PORT=8002
      - PYTHONIOENCODING=utf-8
    ports:
      - "8002:8002"
    volumes:
      - ../..:/workspace/source:ro
      - ../scripts:/workspace/scripts:ro
      - ../dist:/workspace/dist:ro
      - ../logs:/workspace/logs:rw
    restart: unless-stopped
    command: ["/workspace/scripts/deploy.sh"]

  nanogpt-phase2-verify:
    container_name: nanogpt-phase2-verify
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder-ai
    environment:
      - VIRTUAL_ENV=/opt/venv_nanogpt
      - PATH=/opt/venv_nanogpt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYTHONIOENCODING=utf-8
    volumes:
      - ../..:/workspace/source:ro
      - ../scripts:/workspace/scripts:ro
      - ../dist:/workspace/dist:ro
      - ../logs:/workspace/logs:rw
    restart: "no"
    command: ["/workspace/scripts/verify.sh"]
