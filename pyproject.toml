[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt-phase1"
version = "0.1.0"
description = "nanoGPT Phase 1: Modern Transformer Architecture with RoPE, RMSNorm, SwiGLU, and SDPA."
readme = "README.md"
authors = [{ name = "AI Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tiktoken",
    "onnx"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["data*", "config*", "assets*", "build*", "dist*"]
