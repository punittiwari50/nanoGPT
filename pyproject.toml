[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogpt-phase3"
version = "0.1.0"
description = "nanoGPT Phase 3: Production Inference Engine with KV-Caching, FastAPI Streaming SSE Server, and INT8 Quantization."
readme = "README.md"
authors = [{ name = "AI Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tiktoken",
    "fastapi",
    "uvicorn[standard]",
    "pydantic"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["data*", "config*", "assets*", "build*", "dist*"]
